<body>
<div class="wrap">
 <header><a class="brand" href="#">apple · NPC PORTRAITS</a><div class="head-actions"><a class="steam" href="https://steamcommunity.com/sharedfiles/filedetails/?id=3833573607" target="_blank" rel="noopener" data-t="steam">Steam 工坊 ↗</a><button class="language" id="language" type="button">EN</button></div></header>
 <main>
  <section class="intro"><div><p class="eyebrow">PROBABLY STOLEN · BEFORE / AFTER</p><h1 data-t="title">每一位，都有新的面貌。</h1><p data-t="intro">209 張立繪，原版在左、重繪在右。從 Eleanor 開始，逐張查看角色、服裝與表情。</p></div><div class="count" id="count" aria-live="polite">209 / 209 PORTRAITS</div></section>
  <div class="tools"><label class="sr-search" style="display:contents"><span hidden>搜尋角色</span><input class="search" id="search" type="search" placeholder="搜尋角色名稱或編號，例如 Eleanor" aria-label="搜尋角色名稱或編號" autocomplete="off"></label><div class="filters" id="filters" role="group" aria-label="角色分類"></div></div>
  <div class="grid" id="gallery"></div><p class="empty" id="empty" hidden data-t="empty">沒有找到符合的角色。</p>
 </main>
 <footer><span data-t="footer">名稱對照遊戲中英文資料；共用外觀以身份顯示。spy 尚未找到對應角色名稱。</span><span>apple · Probably Stolen</span></footer>
</div>
<section class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-labelledby="lightbox-title" hidden>
 <div class="lb-head"><span class="lb-title" id="lightbox-title"></span><button class="lb-close" id="close" type="button" data-t="close">關閉 ×</button></div>
 <div class="lb-view" id="lb-view"><img class="lb-image" id="large-image" alt=""><a class="download lb-link" id="original-link" href="#" target="_blank" rel="noopener" data-t="original">開啟原圖 ↗</a></div>
 <div class="lb-nav"><button id="previous" type="button" data-t="previous">← 上一張</button><span class="lb-index" id="lightbox-index" aria-live="polite"></span><button id="next" type="button" data-t="next">下一張 →</button></div><div class="lb-hint" data-t="hint">← → 切換圖片 · Esc 關閉</div>
</section>
<script src="gallery-data.js"></script>
<script>
(()=>{
'use strict';
const all=window.PORTRAITS||[],gallery=document.getElementById('gallery'),search=document.getElementById('search'),filters=document.getElementById('filters'),lightbox=document.getElementById('lightbox'),large=document.getElementById('large-image'),prev=document.getElementById('previous'),next=document.getElementById('next'),close=document.getElementById('close');
let lang=(navigator.language||'').toLowerCase().startsWith('zh')?'zh':'en',group='all',visible=all,index=0,returnFocus=null;
const copy={zh:{title:'每一位，都有新的面貌。',intro:'209 張立繪，原版在左、重繪在右。從 Eleanor 開始，逐張查看角色、服裝與表情。',steam:'Steam 工坊 ↗',empty:'沒有找到符合的角色。',footer:'名稱對照遊戲中英文資料；共用外觀以身份顯示。spy 尚未找到對應角色名稱。',close:'關閉 ×',original:'開啟原圖 ↗',previous:'← 上一張',next:'下一張 →',hint:'← → 切換圖片 · Esc 關閉',search:'搜尋角色名稱或編號，例如 Eleanor',all:'全部',eleanor:'Eleanor',upper:'上層區',lower:'下層區',market:'黑市',farmer:'農民',scavenger:'拾荒者',story:'其他角色'},en:{title:'A new face for every story.',intro:'209 portraits. Original on the left, redraw on the right. Start with Eleanor and explore every character, outfit and expression.',steam:'Steam Workshop ↗',empty:'No matching portraits.',footer:'Names follow the game Chinese / English tables. Shared appearances use role labels. The spy portrait has no confirmed NPC name.',close:'Close ×',original:'Open full image ↗',previous:'← Previous',next:'Next →',hint:'← → to browse · Esc to close',search:'Search character name or ID, e.g. Eleanor',all:'All',eleanor:'Eleanor',upper:'Upper district',lower:'Lower district',market:'Black market',farmer:'Farmers',scavenger:'Scavengers',story:'Other characters'}};
const groups=['all','eleanor','upper','lower','market','farmer','scavenger','story'];
function title(p){return lang==='zh'?p.nameZh:p.nameEn;}
function alternate(p){return lang==='zh'?p.nameEn:p.nameZh;}
function searchable(p){return [p.name,p.id,p.nameZh,p.nameEn,...p.aliases.flatMap(a=>[a.zh,a.en])].join(' ').toLowerCase();}
function translate(){document.documentElement.lang=lang==='zh'?'zh-Hant':'en';document.querySelectorAll('[data-t]').forEach(el=>el.textContent=copy[lang][el.dataset.t]);document.getElementById('language').textContent=lang==='zh'?'EN':'中文';search.placeholder=copy[lang].search;search.setAttribute('aria-label',copy[lang].search);filters.setAttribute('aria-label',lang==='zh'?'角色分類':'Character categories');render();if(!lightbox.hidden)show(index,false);}
function render(){const q=search.value.trim().toLowerCase();visible=all.filter(p=>(group==='all'||p.group===group)&&(!q||searchable(p).includes(q)));document.getElementById('count').textContent=visible.length+' / '+all.length+' PORTRAITS';document.getElementById('empty').hidden=visible.length>0;filters.replaceChildren(...groups.map(g=>{const b=document.createElement('button');b.className='filter'+(g===group?' active':'');b.type='button';b.textContent=copy[lang][g];b.setAttribute('aria-pressed',g===group?'true':'false');b.onclick=()=>{group=g;render();};return b;}));gallery.replaceChildren(...visible.map((p,i)=>{const f=document.createElement('figure');f.className='portrait';const b=document.createElement('button');b.type='button';b.className='image-button';b.setAttribute('aria-label',(lang==='zh'?'放大 ':'Enlarge ')+title(p));const img=document.createElement('img');img.src=p.thumb;img.alt=title(p)+' — Before / After';img.width=640;img.height=360;img.loading=i<3?'eager':'lazy';img.decoding='async';b.append(img);b.onclick=()=>{returnFocus=b;show(i,true);};const cap=document.createElement('figcaption');cap.className='caption';const name=document.createElement('strong');name.className='name-pair';name.textContent=title(p);const translated=document.createElement('small');translated.textContent=alternate(p);name.append(translated);name.title=p.aliases.map(a=>a.zh+' / '+a.en).join('\n');const id=document.createElement('span');id.textContent=p.id;cap.append(name,id);f.append(b,cap);return f;}));}
function show(i,opening){index=Math.max(0,Math.min(visible.length-1,i));const p=visible[index];if(!p)return;large.src=p.image;large.alt=title(p)+' — Before / After';document.getElementById('lightbox-title').textContent=title(p)+' / '+alternate(p)+' · '+p.id;document.getElementById('lightbox-index').textContent=(index+1)+' / '+visible.length;document.getElementById('original-link').href=p.image;prev.disabled=index===0;next.disabled=index===visible.length-1;lightbox.hidden=false;document.body.classList.add('scroll-lock');if(opening){close.focus();history.replaceState(null,'','#'+p.id);}else if(location.hash.slice(1)!==p.id)history.replaceState(null,'','#'+p.id);for(const offset of [-1,1]){const item=visible[index+offset];if(item){const preload=new Image();preload.src=item.image;}}}
function dismiss(){lightbox.hidden=true;document.body.classList.remove('scroll-lock');history.replaceState(null,'',location.pathname+location.search);if(returnFocus&&document.contains(returnFocus))returnFocus.focus();}
prev.onclick=()=>show(index-1,false);next.onclick=()=>show(index+1,false);close.onclick=dismiss;search.addEventListener('input',render);document.getElementById('language').onclick=()=>{lang=lang==='zh'?'en':'zh';translate();};
document.addEventListener('keydown',e=>{if(lightbox.hidden)return;if(e.key==='Escape'){e.preventDefault();dismiss();}if(e.key==='ArrowLeft'){e.preventDefault();show(index-1,false);}if(e.key==='ArrowRight'){e.preventDefault();show(index+1,false);}if(e.key==='Tab'){const focus=[...lightbox.querySelectorAll('button:not([disabled]),a[href]')];const first=focus[0],last=focus[focus.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
let startX=0,startY=0;const view=document.getElementById('lb-view');view.addEventListener('touchstart',e=>{if(e.touches.length===1){startX=e.touches[0].clientX;startY=e.touches[0].clientY;}},{passive:true});view.addEventListener('touchend',e=>{const t=e.changedTouches[0];if(!t)return;const dx=t.clientX-startX,dy=t.clientY-startY;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)show(index+(dx<0?1:-1),false);},{passive:true});
translate();const initial=all.findIndex(p=>p.id===location.hash.slice(1));if(initial>=0)show(initial,true);
})();
</script>
